<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FarmersHub</title>

  <!-- Editorial brand fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- shovel cursor (styles live in style.css) -->
  <script src="shovel-cursor.js" defer></script>

  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Hero (revealed after the intro plays) -->
  <main class="hero" id="hero">

    <!-- Looping farm video background. Plays muted; falls back to the
         poster image when motion is reduced (play() is gated in script.js). -->
    <video
      class="scene-video"
      muted
      loop
      playsinline
      poster="farm.jpg"
      aria-hidden="true"
    >
      <source src="farm.mp4" type="video/mp4" />
    </video>

    <!-- Scrim keeps the hero text readable over the video -->
    <div class="hero__scrim" aria-hidden="true"></div>

    <div class="hero__inner">
      <div class="hero__badge">
        <img class="hero__logo" src="logo.png" alt="FarmersHub logo" />
      </div>
      <h1 class="hero__title">FarmersHub</h1>
      <p class="hero__tagline">
        Fresh from the farm to your hands — connecting growers and buyers, directly.
      </p>
      <button class="hero__cta" type="button" id="getStarted">Get Started</button>
    </div>

    <!--
      Login view — revealed when "Get Started" is clicked. It sits on top of the
      same, still-playing video + scrim (above .hero__inner), so the moment feels
      continuous. UI only: nothing is validated, stored, or sent anywhere.
    -->
    <section class="login" id="login" aria-hidden="true">
      <button class="login__back" type="button" id="loginBack">
        <span aria-hidden="true">←</span> Back
      </button>

      <form class="login__card" novalidate>
        <div class="login__badge">
          <img src="logo.png" alt="FarmersHub logo" />
        </div>
        <h2 class="login__heading">Welcome back</h2>
        <p class="login__subtitle">Log in to your FarmersHub account</p>

        <div class="field">
          <label class="field__label" for="email">Email</label>
          <div class="field__control">
            <svg class="icon field__icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m3 7 9 6 9-6" />
            </svg>
            <input
              class="field__input"
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
            />
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="password">Password</label>
          <div class="field__control">
            <svg class="icon field__icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="11" width="16" height="9" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <input
              class="field__input"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
            />
            <button
              class="field__eye"
              type="button"
              id="togglePw"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19" />
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>

        <div class="login__row">
          <label class="login__remember">
            <input type="checkbox" />
            <span>Remember me</span>
          </label>
          <a class="login__link" href="#">Forgot password?</a>
        </div>

        <button class="login__submit" type="submit">Log in</button>

        <div class="login__divider"><span>or</span></div>

        <button class="login__google" type="button">
          <svg class="login__google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.04 12.26c0-.82-.07-1.6-.2-2.36H12v4.47h6.19a5.29 5.29 0 0 1-2.3 3.47v2.88h3.72c2.18-2 3.43-4.96 3.43-8.46z" />
            <path fill="#34A853" d="M12 24c3.1 0 5.7-1.03 7.6-2.78l-3.72-2.88c-1.03.7-2.35 1.1-3.88 1.1-2.98 0-5.5-2.01-6.4-4.72H1.75v2.97A12 12 0 0 0 12 24z" />
            <path fill="#FBBC05" d="M5.6 14.72a7.2 7.2 0 0 1 0-4.6V7.15H1.75a12 12 0 0 0 0 10.54l3.85-2.97z" />
            <path fill="#EA4335" d="M12 4.76c1.68 0 3.2.58 4.39 1.72l3.29-3.29C17.7 1.19 15.1 0 12 0A12 12 0 0 0 1.75 6.46l3.85 2.97C6.5 6.74 9.02 4.76 12 4.76z" />
          </svg>
          Continue with Google
        </button>

        <p class="login__footer">
          Don't have an account? <a class="login__link" href="#">Sign up</a>
        </p>
      </form>
    </section>
  </main>

  <!--
    The intro overlay is built in script.js (letters + timings created in JS,
    just like v1) and appended to <body> on load.
  -->
  <script src="script.js"></script>
</body>
</html>
