    #d99a5e 100%
  );

  /* Intro timings (mirrored in script.js — keep the two in step) */
  --letter-stagger: 45ms;       /* delay between each wordmark letter   */
  --letter-duration: 0.5s;      /* per-letter rise + scale-in           */
  --exit-duration: 0.5s;        /* overlay fade + scale-up on exit      */

  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);

  /* Badge size, shared by intro + hero */
  --badge-size: 140px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--brand-gradient);
  color: var(--white);
  -webkit-font-smoothing: antialiased;
}

/* ==========================================================================
   Hero
   ========================================================================== */

.hero {
  position: relative;
  overflow: hidden;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(1.5rem, 5vw, 4rem);
  /* Fallback colour shown only if the video fails to load. */
  background: #b9814e;
}

/* Looping farm video fills the hero, behind everything else. */
.scene-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

/* Soft scrim for text contrast over the photo. */
.hero__scrim {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse 62% 48% at 50% 44%,
      rgba(0, 0, 0, 0.42) 0%,
      rgba(0, 0, 0, 0.2) 45%,
      rgba(0, 0, 0, 0.05) 75%
    ),
    linear-gradient(to bottom, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.32));
}

.hero__inner {
  position: relative;
  z-index: 2;
  max-width: 32rem;
  width: 100%;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(1rem, 3vw, 1.75rem);
}

.hero__badge {
  width: var(--badge-size);
  height: var(--badge-size);
  border-radius: 50%;
  overflow: hidden;
  background: var(--white);
  box-shadow: 0 18px 45px -12px rgba(0, 0, 0, 0.45);
}

.hero__logo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.hero__title {
  margin: 0;
  font-family: "Instrument Serif", Georgia, serif;
  font-weight: 400;
  font-size: clamp(2.5rem, 8.5vw, 4rem);
  letter-spacing: 0.01em;
  line-height: 1.05;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.4);
}

.hero__tagline {
  margin: 0;
  font-weight: 400;
  font-size: clamp(1rem, 3.5vw, 1.25rem);
  line-height: 1.5;
  color: rgba(255, 255, 255, 0.92);
  max-width: 28rem;
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
}

.hero__cta {
  margin-top: 0.5rem;
  font-family: inherit;
  font-weight: 600;
  font-size: clamp(1rem, 3vw, 1.125rem);
  color: var(--white);
  background: var(--red);
  border: none;
  border-radius: 999px;
  padding: 0.85em 2.25em;
  cursor: pointer;
  box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.hero__cta:hover {
  transform: translateY(-2px);
  background: #fbf7ee;
  box-shadow: 0 18px 38px -10px rgba(0, 0, 0, 0.55);
}

.hero__cta:active {
  transform: translateY(0);
}

.hero__cta:focus-visible {
  outline: 3px solid rgba(255, 255, 255, 0.8);
  outline-offset: 3px;
}

/* ==========================================================================
   Intro overlay (built in script.js)
   ========================================================================== */

.intro {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(1.25rem, 4vw, 1.75rem);
  background: var(--brand-gradient);
  opacity: 1;
  transition: opacity var(--exit-duration) ease,
    transform var(--exit-duration) ease;
}

.intro.is-exiting {
  opacity: 0;
  transform: scale(1.04);
}

/* --- logo badge with shine sweep + glow pulse --- */

.intro__badge {
  position: relative;
  width: var(--badge-size);
  height: var(--badge-size);
  border-radius: 50%;
  overflow: hidden;
  background: var(--white);
  box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
}

.intro__logo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.intro__sweep {
  position: absolute;
  inset: 0;
  pointer-events: none;
  transform: translateX(-120%);
  background: linear-gradient(
    115deg,
    transparent 35%,
    rgba(255, 255, 255, 0.85) 50%,
    transparent 65%
  );
}

/* Glow + sweep fire together when the badge gets .is-glowing */
.intro__badge.is-glowing {
  animation: badge-glow 1s ease-out 1;
}

.intro__badge.is-glowing .intro__sweep {
  animation: badge-sweep 1s ease-out 1;
}

@keyframes badge-glow {
  0% {
    box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
  }
  45% {
    box-shadow: 0 0 36px 12px rgba(255, 255, 255, 0.55);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
  }
}

@keyframes badge-sweep {
  0% {
    transform: translateX(-120%);
  }
  100% {
    transform: translateX(120%);
  }
}

/* --- letter-by-letter wordmark --- */

.intro__word {
  display: flex;
  font-family: "Instrument Serif", Georgia, serif;
  font-weight: 400;
  font-size: clamp(2rem, 7.5vw, 3rem);
  letter-spacing: 0.01em;
  color: var(--ink);
}

.intro__letter {
  display: inline-block;
  opacity: 0;
  transform: translateY(14px) scale(0.85);
  animation: letter-in var(--letter-duration) var(--ease-out-expo) forwards;
}

.intro__letter--space {
  width: 0.4em;
}

@keyframes letter-in {
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ==========================================================================
   Reduced motion — skip the intro; the video stays paused on its poster
   (play() is gated in script.js), so no further CSS is needed for it.
   ========================================================================== */

@media (prefers-reduced-motion: reduce) {
  .intro,
  .intro__letter,
  .intro__badge.is-glowing,
  .intro__badge.is-glowing .intro__sweep {
    animation: none !important;
    transition: none !important;
  }

  .intro__letter {
    opacity: 1;
    transform: none;
  }

  .hero__cta {
    transition: none;
  }
}

/* ==========================================================================
   Login view (UI only)
   A frosted glass card on top of the same hero video + scrim. Revealed by
   toggling `.show-login` on the hero; the video keeps playing underneath.
   ========================================================================== */

/* Hero content eases out as the login card eases in (shared timing/easing). */
.hero__inner {
  transition: opacity var(--exit-duration) var(--ease-out-expo),
    transform var(--exit-duration) var(--ease-out-expo);
}

.hero.show-login .hero__inner {
  opacity: 0;
  transform: scale(0.96);
  pointer-events: none;
}

.login {
  position: absolute;
  inset: 0;
  z-index: 3; /* above scrim (1) and hero__inner (2) */
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  padding: clamp(1.25rem, 5vw, 3rem);
  text-align: left;

  opacity: 0;
  visibility: hidden;
  transform: scale(0.98) translateY(10px);
  transition: opacity var(--exit-duration) var(--ease-out-expo),
    transform var(--exit-duration) var(--ease-out-expo),
    visibility 0s linear var(--exit-duration);
}

.hero.show-login .login {
  opacity: 1;
  visibility: visible;
  transform: none;
  transition: opacity var(--exit-duration) var(--ease-out-expo),
    transform var(--exit-duration) var(--ease-out-expo), visibility 0s;
}

.login__back {
  position: absolute;
  top: clamp(1rem, 4vw, 1.75rem);
  left: clamp(1rem, 4vw, 1.75rem);
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-family: inherit;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--white);
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 999px;
  padding: 0.5em 1em;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: background 0.2s ease, transform 0.2s ease;
}

.login__back:hover {
  background: rgba(255, 255, 255, 0.24);
  transform: translateX(-2px);
}

.login__card {
  width: 100%;
  max-width: 25rem;
  margin: auto; /* centers, but lets a tall card scroll instead of clipping */
  display: flex;
  flex-direction: column;
  gap: 1rem;

  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(18px) saturate(120%);
  -webkit-backdrop-filter: blur(18px) saturate(120%);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 22px;
  box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.6);
  padding: clamp(1.5rem, 5vw, 2.25rem);
}

.login__badge {
  width: 56px;
  height: 56px;
  align-self: center;
  border-radius: 50%;
  overflow: hidden;
  background: var(--white);
  box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.5);
}

.login__badge img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.login__heading {
  margin: 0;
  text-align: center;
  font-family: "Instrument Serif", Georgia, serif;
  font-weight: 400;
  font-size: clamp(1.7rem, 5.5vw, 2rem);
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
}

.login__subtitle {
  margin: 0 0 0.25rem;
  text-align: center;
  font-size: 0.95rem;
  color: rgba(255, 255, 255, 0.82);
}

/* --- fields --- */

.field {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.field__label {
  font-size: 0.85rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.9);
}

.field__control {
  position: relative;
  display: flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 14px;
  transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}

.field__control:focus-within {
  border-color: rgba(255, 255, 255, 0.85);
  background: rgba(255, 255, 255, 0.18);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18);
}

.field__input {
  flex: 1;
  min-width: 0;
  font-family: inherit;
  font-size: 1rem;
  color: var(--white);
  background: transparent;
  border: none;
  outline: none;
  padding: 0.8rem 0.9rem;
}

.field__input::placeholder {
  color: rgba(255, 255, 255, 0.55);
}

.icon {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.field__icon {
  flex: none;
  margin-left: 0.75rem;
  color: rgba(255, 255, 255, 0.7);
}

.field__eye {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-right: 0.4rem;
  padding: 0.4rem;
  color: rgba(255, 255, 255, 0.75);
  background: transparent;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: color 0.2s ease, background 0.2s ease;
}

.field__eye:hover {
  color: var(--white);
  background: rgba(255, 255, 255, 0.12);
}

/* Swap eye / eye-off depending on visibility state. */
.field__eye .icon-eye-off {
  display: none;
}

.field__eye.is-on .icon-eye {
  display: none;
}

.field__eye.is-on .icon-eye-off {
  display: inline;
}

/* --- remember / forgot row --- */

.login__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
  font-size: 0.9rem;
}

.login__remember {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  cursor: pointer;
  color: rgba(255, 255, 255, 0.9);
}

.login__remember input {
  width: 16px;
  height: 16px;
  accent-color: var(--red);
}

.login__link {
  color: #ecd9a6;
  font-weight: 600;
  text-decoration: none;
}

.login__link:hover {
  text-decoration: underline;
}

/* --- buttons --- */

.login__submit {
  margin-top: 0.25rem;
  font-family: inherit;
  font-weight: 600;
  font-size: 1.05rem;
  color: var(--white);
  background: linear-gradient(160deg, var(--red), var(--red-ink));
  border: none;
  border-radius: 999px;
  padding: 0.9em 1.5em;
  cursor: pointer;
  box-shadow: 0 12px 28px -10px rgba(0, 0, 0, 0.55);
  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
}

.login__submit:hover {
  transform: translateY(-2px);
  filter: brightness(1.06);
  box-shadow: 0 18px 36px -10px rgba(0, 0, 0, 0.6);
}

.login__submit:active {
  transform: translateY(0);
}

.login__divider {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.6);
}

.login__divider::before,
.login__divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.25);
}

.login__google {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  font-family: inherit;
  font-weight: 600;
  font-size: 1rem;
  color: var(--ink);
  background: var(--white);
  border: none;
  border-radius: 999px;
  padding: 0.8em 1.5em;
  cursor: pointer;
  box-shadow: 0 8px 22px -10px rgba(0, 0, 0, 0.5);
  transition: transform 0.2s ease, background 0.2s ease;
}

.login__google:hover {
  transform: translateY(-2px);
  background: #fbf7ee;
}

.login__google-icon {
  width: 18px;
  height: 18px;
  flex: none;
}

.login__footer {
  margin: 0.25rem 0 0;
  text-align: center;
  font-size: 0.9rem;
  color: rgba(255, 255, 255, 0.85);
}

/* Shared focus-visible ring for the login controls. */
.login__back:focus-visible,
.login__submit:focus-visible,
.login__google:focus-visible,
.field__eye:focus-visible,
.login__link:focus-visible,
.login__remember input:focus-visible {
  outline: 3px solid rgba(255, 255, 255, 0.85);
  outline-offset: 2px;
}

/* Reduced motion — switch views instantly, no fade/scale (matches the splash). */
@media (prefers-reduced-motion: reduce) {
  .hero__inner,
  .login,
  .login__back,
  .login__submit,
  .login__google,
  .field__control,
  .field__eye {
    transition: none !important;
  }
}

              <rect x="4" y="11" width="16" height="9" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            <input
              class="field__input"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
            />
            <button
              class="field__eye"
              type="button"
              id="togglePw"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19" />
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>

        <div class="login__row">
          <label class="login__remember">
            <input type="checkbox" />
            <span>Remember me</span>
          </label>
          <a class="login__link" href="#">Forgot password?</a>
        </div>

        <button class="login__submit" type="submit">Log in</button>

        <div class="login__divider"><span>or</span></div>

        <button class="login__google" type="button">
          <svg class="login__google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.04 12.26c0-.82-.07-1.6-.2-2.36H12v4.47h6.19a5.29 5.29 0 0 1-2.3 3.47v2.88h3.72c2.18-2 3.43-4.96 3.43-8.46z" />
            <path fill="#34A853" d="M12 24c3.1 0 5.7-1.03 7.6-2.78l-3.72-2.88c-1.03.7-2.35 1.1-3.88 1.1-2.98 0-5.5-2.01-6.4-4.72H1.75v2.97A12 12 0 0 0 12 24z" />
            <path fill="#FBBC05" d="M5.6 14.72a7.2 7.2 0 0 1 0-4.6V7.15H1.75a12 12 0 0 0 0 10.54l3.85-2.97z" />
            <path fill="#EA4335" d="M12 4.76c1.68 0 3.2.58 4.39 1.72l3.29-3.29C17.7 1.19 15.1 0 12 0A12 12 0 0 0 1.75 6.46l3.85 2.97C6.5 6.74 9.02 4.76 12 4.76z" />
          </svg>
          Continue with Google
        </button>

        <p class="login__footer">
          Don't have an account? <a class="login__link" href="#">Sign up</a>
        </p>
      </form>
    </section>
  </main>

  <!--
    The intro overlay is built in script.js (letters + timings created in JS,
    just like v1) and appended to <body> on load.
  -->
  <script>
  const hero=document.getElementById('hero');
  document.getElementById('getStarted').onclick=()=>hero.classList.add('show-login');
  document.getElementById('loginBack').onclick=()=>hero.classList.remove('show-login');
  const pw=document.getElementById('togglePw');
  if(pw) pw.onclick=()=>{const i=document.getElementById('password');const on=i.type==='text';i.type=on?'password':'text';pw.classList.toggle('is-on',!on);pw.setAttribute('aria-pressed',String(!on));};
</script>
</body>
</html>
