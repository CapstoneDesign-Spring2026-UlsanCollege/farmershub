<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Farmers - FarmersHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="farmers-profile.css">
</head>

<body>
<canvas id="fallingCanvas"></canvas>

<header class="top-nav">
  <a href="index.html" class="brand">
    <img src="assets/images/logorefined.png" alt="FarmersHub Logo" class="home-logo" id="homeLogo">
    <div>
      <p class="brand-overline">Green Marketplace</p>
      <h1>FarmersHub</h1>
    </div>
  </a>

  <form class="global-search" action="#" method="get">
    <span class="search-icon">⌕</span>
    <input type="search" id="farmerSearch" placeholder="Search farmers, locations, and crops">
  </form>

  <nav class="user-nav">
    <a href="index.html" class="nav-chip">Home</a>
    <a href="product.html" class="nav-chip">Products</a>
    <a href="messages.html" class="nav-chip">Messages</a>
    <a href="notifications.html" class="nav-chip">Alerts</a>
    <a href="login/login.html" class="login-btn" id="navLoginBtn">Login</a>
    <button class="login-btn" id="navLogoutBtn" style="display:none;">Logout</button>
  </nav>
</header>

<main class="farmers-directory">
  <section class="directory-hero">
    <div>
      <p class="eyebrow">Farmer Directory</p>
      <h2>Browse growers and open their profiles.</h2>
      <p>Find local farmers, learn what they grow, and start a message from their profile.</p>
    </div>
    <a href="login/createAccount.html" class="directory-action">Join FarmersHub</a>
  </section>

  <section class="directory-section">
    <div class="section-heading">
      <h3>All Farmers</h3>
      <span id="farmerCount">Loading...</span>
    </div>
    <div class="farmers-grid" id="farmersDirectory"></div>
  </section>
</main>

<script type="module" src="farmers-profile.js"></script>
</body>
</html>
