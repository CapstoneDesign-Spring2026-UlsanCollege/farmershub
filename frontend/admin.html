<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | FarmersHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
  <script>
    if (['localhost', '127.0.0.1'].includes(window.location.hostname)) {
      window.FARMERSHUB_API_BASE = window.location.origin + '/api';
    }
  </script>
</head>
<body class="admin-body">
  <div class="admin-app">
    <aside class="admin-sidebar">
      <a class="admin-brand" href="admin.html">
        <img src="assets/images/logorefined.png" alt="FarmersHub Logo">
        <span>
          <strong>FarmersHub</strong>
          <small>Admin Panel</small>
        </span>
      </a>

      <nav class="admin-nav" aria-label="Admin navigation">
        <button type="button" class="active" data-section="dashboard"><span>DB</span>Dashboard</button>
        <button type="button" data-section="users"><span>US</span>Users</button>
        <button type="button" data-section="products"><span>PR</span>Products & Uploads</button>
        <button type="button" data-section="orders"><span>OR</span>Orders</button>
        <button type="button" data-section="messages"><span>MS</span>Messages</button>
        <button type="button" data-section="assistant"><span>AI</span>AI Assistant</button>
        <button type="button" data-section="settings"><span>ST</span>System Settings</button>
        <button type="button" data-section="announcements"><span>AN</span>Announcements</button>
        <button type="button" data-section="logs"><span>LG</span>Logs</button>
        <button type="button" data-section="backup"><span>BK</span>Backup & Restore</button>
      </nav>

      <button class="admin-logout" type="button" id="adminLogout">Logout</button>
    </aside>

    <section class="admin-main">
      <header class="admin-topbar">
        <button class="admin-menu-button" type="button" id="adminMenuButton" aria-label="Toggle navigation">Menu</button>
        <div>
          <p>Administrator</p>
          <strong id="adminIdentity">sonam@gmail.com</strong>
        </div>
      </header>

      <main class="admin-content" id="adminContent" aria-live="polite">
        <section class="admin-loading">
          <strong>Loading admin workspace</strong>
          <span>Checking secure admin access.</span>
        </section>
      </main>

      <footer class="admin-statusbar" id="adminStatusbar">
        <span>System Status: Checking</span>
        <span>Maintenance: Checking</span>
        <span>Database: Checking</span>
        <span>Version: 1.0.0</span>
      </footer>
    </section>
  </div>

  <section class="admin-assistant" id="assistantPanel" aria-label="AI Assistant">
    <header>
      <strong>AI Assistant</strong>
      <div>
        <button type="button" id="assistantMinimize" aria-label="Minimize assistant">-</button>
        <button type="button" id="assistantClose" aria-label="Close assistant">x</button>
      </div>
    </header>
    <div class="assistant-thread" id="assistantThread"></div>
    <div class="assistant-chips" id="assistantChips">
      <button type="button">Top active farmers</button>
      <button type="button">Pending orders</button>
      <button type="button">Users by role</button>
      <button type="button">Recent products</button>
    </div>
    <form class="assistant-form" id="assistantForm">
      <input type="text" id="assistantInput" placeholder="Ask anything..." autocomplete="off">
      <button type="submit" aria-label="Send assistant message">Go</button>
    </form>
  </section>

  <div class="admin-toast" id="adminToast" role="status"></div>
  <div class="admin-modal" id="adminModal" hidden></div>

  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
